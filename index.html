<!doctype html>
<html>

<head>
    <title>My first AR project</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js">
    </script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script type="module" src="https://raw.githack.com/b2renger/microprojetar/main/lib/qrTunnel.js"></script>

</head>


<body style="margin : 0px; overflow: hidden;">
    <a-scene embedded
      arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; trackingMethod: best ; changeMatrixMode: modelViewMatrix;"
      renderer="sortObjects: true; antialias: true; colorManagement: true; logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false"
      smooth=" true"
      smoothCount="5"
      smoothTolerance=".05"
      smoothThreshold="5"
      sourceWidth="800"
      sourceHeight="600"
      displayWidth="1280"
      displayHeight="720"
    >
        <a-marker type='barcode' value='0'>
            <a-text value="Hell0_W0rld !" side="double" position="0 0 -1" rotation="270 0 0" width="8" color="#131C1E"
                align="right">
            </a-text>
            <a-asset-item id="glbTest" src="./plant_modelling.glb" align="left"></a-asset-item>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
